<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Rahmotpur News</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color"
content="#d40000">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f3f3;
color:#222;
}

/* HEADER */

header{
background:#d40000;
color:white;
padding:18px 15px;
text-align:center;
}

header h1{
margin:0;
font-size:28px;
}

header p{
margin:6px 0 0;
font-size:14px;
}

/* TOP MENU */

nav{
background:#111;
padding:12px 8px;
display:flex;
overflow-x:auto;
gap:8px;
}

nav a{
color:white;
text-decoration:none;
background:#333;
padding:8px 12px;
border-radius:20px;
font-size:13px;
white-space:nowrap;
}

/* CONTAINER */

.container{
max-width:900px;
margin:auto;
padding:15px;
}

/* WELCOME */

.welcome{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:18px;
box-shadow:0 2px 8px #ccc;
}

.welcome h2{
color:#d40000;
margin-top:0;
}

/* BUTTON */

.main-button{
display:inline-block;
background:#d40000;
color:white;
padding:12px 18px;
border-radius:7px;
text-decoration:none;
}

/* CATEGORY TITLE */

.category-title{
font-size:21px;
margin:20px 0 12px;
color:#d40000;
}

/* CATEGORY GRID */

.categories{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.category{
background:white;
padding:18px 10px;
text-align:center;
border-radius:12px;
text-decoration:none;
color:#222;
font-weight:bold;
box-shadow:0 2px 7px #ccc;
}

.category .icon{
font-size:30px;
display:block;
margin-bottom:7px;
}

/* NEWS */

.latest-section{
margin-top:25px;
}

.news-card{
background:white;
margin-bottom:15px;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 8px #ccc;
}

.news-card img{
width:100%;
max-height:230px;
object-fit:cover;
display:block;
}

.news-content{
padding:15px;
}

.news-title{
font-size:18px;
font-weight:bold;
line-height:1.5;
color:#222;
margin-bottom:8px;
}

.news-date{
font-size:12px;
color:#777;
}

.news-button{
display:inline-block;
margin-top:10px;
background:#d40000;
color:white;
padding:8px 12px;
border-radius:6px;
text-decoration:none;
font-size:13px;
}

/* FOOTER */

footer{
background:#111;
color:white;
text-align:center;
padding:22px 10px;
margin-top:30px;
font-size:13px;
}

/* DESKTOP */

@media(min-width:600px){

.categories{
grid-template-columns:repeat(4,1fr);
}

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

<h1>📰 Rahmotpur News</h1>

<p>
আপনার এলাকার খবর সবার আগে
</p>

</header>


<!-- TOP NAVIGATION -->

<nav id="topNav"></nav>


<div class="container">


<!-- WELCOME -->

<div class="welcome">

<h2>
Welcome to Rahmotpur News
</h2>

<p>
রহমতপুর, মিঠাপুকুরসহ দেশের গুরুত্বপূর্ণ খবর
জানতে আমাদের নিউজ পোর্টালে প্রবেশ করুন।
</p>

<a
class="main-button"
href="https://rahmotpurnewsbd.blogspot.com/">

সর্বশেষ খবর দেখুন

</a>

</div>


<!-- CATEGORIES -->

<h2 class="category-title">
📰 সংবাদ বিভাগ
</h2>

<div
class="categories"
id="categories">

</div>


<!-- LATEST NEWS -->

<div class="latest-section">

<h2 class="category-title">
🔴 সর্বশেষ খবর
</h2>

<div id="latestNews">

<p style="text-align:center;">
খবর লোড হচ্ছে...
</p>

</div>

</div>


</div>


<!-- FOOTER -->

<footer>

© 2026 Rahmotpur News

<br>

আপনার এলাকার খবর সবার আগে

</footer>


<script>

/* =========================
   BLOGGER WEBSITE
========================= */

const BLOGGER =
"https://rahmotpurnewsbd.blogspot.com";


/* =========================
   BLOGGER LABELS
========================= */

const labels = [

{
name:"রহমতপুর",
icon:"📍"
},

{
name:"ইমাদপুর",
icon:"🏘️"
},

{
name:"মিঠাপুকুর",
icon:"📌"
},

{
name:"রাজনীতি",
icon:"🏛️"
},

{
name:"জাতীয়",
icon:"🇧🇩"
},

{
name:"আন্তর্জাতিক",
icon:"🌍"
},

{
name:"সারাদেশ",
icon:"🗺️"
},

{
name:"খেলাধুলা",
icon:"⚽"
},

{
name:"অপরাধ",
icon:"🚔"
},

{
name:"মতামত",
icon:"💬"
},

{
name:"শিক্ষা",
icon:"🎓"
},

{
name:"ধর্মীয়",
icon:"🕌"
},

{
name:"আবহাওয়া",
icon:"🌦️"
},

{
name:"বিনোদন",
icon:"🎬"
},

{
name:"পরিবেশ",
icon:"🌳"
},

{
name:"রহমতপুরের আশেপাশের অঞ্চল",
icon:"📍"
}

];


/* =========================
   CREATE CATEGORY BUTTONS
========================= */

const categoryBox =
document.getElementById("categories");


labels.forEach(function(item){

const link =
document.createElement("a");

link.className =
"category";

link.href =
BLOGGER +
"/search/label/" +
encodeURIComponent(item.name);

link.innerHTML =
'<span class="icon">' +
item.icon +
'</span>' +
item.name;

categoryBox.appendChild(link);

});


/* =========================
   TOP NAVIGATION
========================= */

const topNav =
document.getElementById("topNav");


const home =
document.createElement("a");

home.href =
"https://rahmotpur-news-bd.github.io/rahmotpur-news-pwa/";

home.textContent =
"হোম";

topNav.appendChild(home);


const latest =
document.createElement("a");

latest.href =
BLOGGER;

latest.textContent =
"সর্বশেষ";

topNav.appendChild(latest);


[
"জাতীয়",
"রাজনীতি",
"আন্তর্জাতিক",
"খেলাধুলা"
].forEach(function(name){

const a =
document.createElement("a");

a.href =
BLOGGER +
"/search/label/" +
encodeURIComponent(name);

a.textContent =
name;

topNav.appendChild(a);

});


/* =========================
   BLOGGER NEWS
========================= */

function showNews(data){

const newsBox =
document.getElementById("latestNews");

const entries =
data.feed.entry || [];


newsBox.innerHTML = "";


if(entries.length === 0){

newsBox.innerHTML =
"<p style='text-align:center;'>কোনো খবর পাওয়া যায়নি।</p>";

return;

}


entries.forEach(function(entry){


/* TITLE */

const title =
entry.title.$t;


/* LINK */

let link =
BLOGGER;


if(entry.link){

const alternate =
entry.link.find(function(item){

return item.rel === "alternate";

});

if(alternate){

link =
alternate.href;

}

}


/* IMAGE */

let image =
"";


if(entry.media$thumbnail){

image =
entry.media$thumbnail.url
.replace("s72-c","s800");

}


/* DATE */

let date = "";


if(entry.published){

date =
new Date(
entry.published.$t
).toLocaleDateString(
"bn-BD"
);

}


/* CARD */

const card =
document.createElement("div");

card.className =
"news-card";


/* IMAGE */

if(image){

const img =
document.createElement("img");

img.src =
image;

img.alt =
title;

card.appendChild(img);

}


/* CONTENT */

const content =
document.createElement("div");

content.className =
"news-content";


const titleElement =
document.createElement("div");

titleElement.className =
"news-title";

titleElement.textContent =
title;


const dateElement =
document.createElement("div");

dateElement.className =
"news-date";

dateElement.textContent =
"প্রকাশ: " + date;


const button =
document.createElement("a");

button.className =
"news-button";

button.href =
link;

button.textContent =
"বিস্তারিত পড়ুন";


content.appendChild(
titleElement
);

content.appendChild(
dateElement
);

content.appendChild(
button
);


card.appendChild(
content
);


newsBox.appendChild(
card
);

});

}


/* =========================
   LOAD BLOGGER JSONP
========================= */

function loadBloggerNews(){

const script =
document.createElement("script");


script.src =
BLOGGER +
"/feeds/posts/default" +
"?alt=json-in-script" +
"&max-results=10" +
"&callback=showNews";


script.onerror =
function(){

document.getElementById(
"latestNews"
).innerHTML =
"<p style='text-align:center;'>খবর লোড করা যাচ্ছে না।</p>";

};


document.body.appendChild(
script
);

}


loadBloggerNews();


/* =========================
   SERVICE WORKER
========================= */

if(
"serviceWorker" in navigator
){

window.addEventListener(
"load",
function(){

navigator.serviceWorker
.register("./sw.js")

.then(function(){

console.log(
"Rahmotpur News PWA ready"
);

})

.catch(function(error){

console.log(
"Service Worker error:",
error
);

});

});

}

</script>


</body>

  </html>
